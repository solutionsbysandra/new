<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Solutions by Sandra</title>

  <!-- Cloudflare Turnstile API Script -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .form-container {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 500px;
      width: 100%;
    }

    .form-container h2 {
      margin-bottom: 8px;
      font-size: 24px;
      color: #1a1a1a;
    }

    .form-container p {
      margin-bottom: 24px;
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
      color: #444;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #0070f3;
      box-shadow: 0 0 0 3px rgba(0, 112, 243, 0.15);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    .cf-turnstile {
      margin-bottom: 18px;
    }

    button[type="submit"] {
      width: 100%;
      background-color: #0070f3;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button[type="submit"]:hover {
      background-color: #0051a8;
    }

    button[type="submit"]:disabled {
      background-color: #999;
      cursor: not-allowed;
    }

    #form-status {
      margin-top: 16px;
      font-size: 14px;
      text-align: center;
      font-weight: 500;
    }

    #form-status.success {
      color: #0e8a16;
    }

    #form-status.error {
      color: #d9381e;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Get in Touch</h2>
    <p>Fill out the form below and we will get back to you shortly.</p>

    <form id="contact-form">
      <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" placeholder="Jane Doe" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" placeholder="jane@example.com" required />
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="(555) 000-0000" />
      </div>

      <div class="form-group">
        <label for="company">Company Name</label>
        <input type="text" id="company" name="company" placeholder="Company / Organization" />
      </div>

      <div class="form-group">
        <label for="message">Message *</label>
        <textarea id="message" name="message" placeholder="How can we help you?" required></textarea>
      </div>

      <!-- Cloudflare Turnstile Widget -->
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAE1EdOrsaOu_LiEO"></div>

      <button type="submit" id="submit-btn">Send Message</button>
      <div id="form-status"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('contact-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusDiv = document.getElementById('form-status');

    // REPLACE THIS WITH YOUR LIVE CLOUDFLARE WORKER URL ONCE CREATED
    const WORKER_ENDPOINT = 'https://your-worker-subdomain.workers.dev';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // UI state reset
      statusDiv.textContent = 'Sending...';
      statusDiv.className = '';
      submitBtn.disabled = true;

      const formData = new FormData(form);
      const payload = {
        name: formData.get('name'),
        email: formData.get('email'),
        phone: formData.get('phone'),
        company: formData.get('company'),
        message: formData.get('message'),
        'cf-turnstile-response': formData.get('cf-turnstile-response')
      };

      try {
        const response = await fetch(WORKER_ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok && result.success) {
          statusDiv.textContent = 'Thank you! Your message has been sent successfully.';
          statusDiv.className = 'success';
          form.reset();
          if (window.turnstile) turnstile.reset();
        } else {
          statusDiv.textContent = result.error || 'Something went wrong. Please try again.';
          statusDiv.className = 'error';
        }
      } catch (err) {
        statusDiv.textContent = 'Network error. Please try again later.';
        statusDiv.className = 'error';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>

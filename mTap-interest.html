<head>
  <meta charset="utf-8">
  <title>mTap landing hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading mTap landing hub...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#F6F8FC;font-family:'DM Sans',system-ui,sans-serif}\nbutton{font-family:'DM Sans',system-ui,sans-serif}\nbutton:focus-visible,a:focus-visible{outline:3px solid #0A1C4D;outline-offset:3px}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width: 1440px; height: 820px; box-sizing: border-box; padding: 28px 44px; background: #F6F8FC; color: #0A1C4D; display: flex; flex-direction: column; gap: 16px; font-family: 'DM Sans', system-ui, sans-serif\">\n  <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 24px\">\n    <div style=\"display: flex; flex-direction: column; gap: 6px\">\n      <div style=\"display: flex; gap: 12px; align-items: center\">\n        <div style=\"font-family: 'Poppins', 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #3457C9\">Hello, we are mTap<\u002Fdiv>\n        <div style=\"padding: 3px 12px; border-radius: 999px; background: #F3E337; color: #0A1C4D; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase\">Networking and events in one place<\u002Fdiv>\n      <\u002Fdiv>\n      <h1 style=\"margin: 0; font-family: 'Poppins', 'DM Sans', sans-serif; font-weight: 800; font-size: 40px; line-height: 1.1; letter-spacing: -0.02em; color: #0B2B84\">Turn every hello into a real relationship.<\u002Fh1>\n      <p style=\"margin: 0; font-size: 18px; line-height: 1.4; color: #4A5578\">Share who you are. Capture who you meet. Follow up with everyone.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 8px; align-items: flex-end\">\n      <div style=\"font-family: 'Poppins', 'DM Sans', sans-serif; font-weight: 700; font-size: 15px; color: #0B2B84\">Use mTap anywhere<\u002Fdiv>\n      <div style=\"display: flex; gap: 10px\">\n        <div style=\"display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #FFFFFF; border: 1.5px solid #DDE3F2; border-radius: 12px\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0B2B84\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M3 12h18\"><\u002Fpath><path d=\"M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z\"><\u002Fpath><\u002Fsvg><div><span style=\"display: block; font-size: 15px; font-weight: 700; line-height: 1.2; color: #0A1C4D\">Web browser<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #FFFFFF; border: 1.5px solid #DDE3F2; border-radius: 12px\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0B2B84\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"7\" y=\"2.5\" width=\"10\" height=\"19\" rx=\"2.2\"><\u002Frect><path d=\"M11 18.5h2\"><\u002Fpath><\u002Fsvg><div><span style=\"display: block; font-size: 15px; font-weight: 700; line-height: 1.2; color: #0A1C4D\">App Store<\u002Fspan><span style=\"display: block; font-size: 13px; font-weight: 500; line-height: 1.2; color: #4A5578\">iPhone<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #FFFFFF; border: 1.5px solid #DDE3F2; border-radius: 12px\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0B2B84\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3.5\" y=\"3.5\" width=\"17\" height=\"17\" rx=\"4\"><\u002Frect><path d=\"M10 8.5l6 3.5-6 3.5z\"><\u002Fpath><\u002Fsvg><div><span style=\"display: block; font-size: 15px; font-weight: 700; line-height: 1.2; color: #0A1C4D\">Google Play<\u002Fspan><span style=\"display: block; font-size: 13px; font-weight: 500; line-height: 1.2; color: #4A5578\">Android<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; gap: 36px; align-items: flex-start\">\n    <div style=\"position: relative; width: 700px; height: 630px; flex-shrink: 0\">\n      <sc-for list=\"{{bubbles}}\" as=\"b\" hint-placeholder-count=\"5\">\n        <div style=\"position: absolute; left: 350px; top: 298px; width: {{b.spokeLen}}px; height: 3px; border-radius: 2px; background: {{b.spokeColor}}; transform-origin: 0 50%; transform: rotate({{b.spokeAng}}deg)\"><\u002Fdiv>\n      <\u002Fsc-for>\n\n      <button sc-camel-on-click=\"{{reset}}\" aria-label=\"Back to the start\" style=\"position: absolute; left: 260px; top: 210px; width: 180px; height: 180px; box-sizing: border-box; border-radius: 50%; border: 0; background: #0A1C4D; cursor: pointer; display: flex; align-items: center; justify-content: center\">\n        <img src=\"b647551b-213a-4c65-be6f-99672f41e3c0\" alt=\"\" style=\"display: block; width: 140px; height: auto\">\n      <\u002Fbutton>\n\n      <sc-for list=\"{{bubbles}}\" as=\"b\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{b.pick}}\" aria-pressed=\"{{b.on}}\" style=\"position: absolute; left: {{b.left}}px; top: {{b.top}}px; width: 186px; height: 186px; box-sizing: border-box; padding: 12px; border-radius: 50%; border: 2px solid {{b.border}}; background: {{b.bg}}; color: {{b.fg}}; cursor: pointer; display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center\"><span style=\"font-family: 'Poppins', 'DM Sans', sans-serif; font-size: 18px; font-weight: 700; line-height: 1.15; letter-spacing: 0.04em; text-transform: uppercase\">{{b.label}}<\u002Fspan><span style=\"display: flex; flex-wrap: wrap; gap: 5px; justify-content: center\"><sc-for list=\"{{b.pills}}\" as=\"pl\" hint-placeholder-count=\"3\"><span style=\"display: block; padding: 3px 10px; border-radius: 999px; background: {{pl.bg}}; color: {{pl.fg}}; font-size: 13px; font-weight: 700; line-height: 1.2\">{{pl.t}}<\u002Fspan><\u002Fsc-for><\u002Fspan><\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"flex: 1 1 0; height: 630px; box-sizing: border-box; padding: 24px 28px; background: #FFFFFF; border: 1px solid #DDE3F2; border-radius: 24px; display: flex; flex-direction: column; gap: 14px\">\n      <sc-if value=\"{{idle}}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"display: inline-flex; align-self: flex-start; padding: 5px 12px; border-radius: 999px; background: #F3E337; color: #0A1C4D; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase\">Start anywhere<\u002Fdiv>\n          <div style=\"font-family: 'Poppins', 'DM Sans', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.2; color: #0B2B84\">Choose your area of interest and see how mTap can help you reach your goals.<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 19px; line-height: 1.45; color: #4A5578\">Tap a bubble to learn more.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{active}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap\">\n            <div style=\"display: inline-flex; padding: 5px 12px; border-radius: 999px; background: #F3E337; color: #0A1C4D; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase\">{{cat.label}}<\u002Fdiv>\n            <div style=\"font-family: 'Poppins', 'DM Sans', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2; color: #0B2B84\">{{cat.promise}}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; gap: 8px\">\n            <sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{t.pick}}\" aria-pressed=\"{{t.on}}\" style=\"flex: 1 1 0; min-height: 46px; padding: 6px 8px; border-radius: 12px; border: 1.5px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font-size: 16px; font-weight: 700; line-height: 1.15; cursor: pointer\">{{t.label}}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; background: #F6F8FC; border: 1px solid #DDE3F2; border-radius: 16px\">\n            <div style=\"font-family: 'Poppins', 'DM Sans', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.25; color: #0A1C4D\">{{sub.promise}}<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 7px\">\n              <sc-for list=\"{{sub.chips}}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 17px; line-height: 1.3; color: #0A1C4D\">\n                  <div style=\"flex-shrink: 0; width: 10px; height: 10px; margin-top: 7px; border-radius: 50%; background: #F3E337; border: 1.5px solid #0B2B84\"><\u002Fdiv>\n                  <div>{{c.t}}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 18px; align-items: center; flex-wrap: wrap\">\n              <a href=\"{{sub.href}}\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 24px; border-radius: 999px; background: #F3E337; color: #0A1C4D; font-size: 16px; font-weight: 700; text-decoration: none\">Learn more<\u002Fa>\n              <sc-for list=\"{{sub.alts}}\" as=\"a\" hint-placeholder-count=\"2\">\n                <a href=\"{{a.href}}\" style=\"font-size: 15px; font-weight: 700; line-height: 1.3; color: #0B2B84; text-decoration: underline\">{{a.label}}<\u002Fa>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{active}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top: auto; padding-top: 10px; border-top: 1px solid #DDE3F2; font-size: 15px; line-height: 1.4; color: #4A5578\">mTap brings all of this together in one place.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0B2B84&quot;,&quot;options&quot;:[&quot;#0B2B84&quot;,&quot;#3457C9&quot;,&quot;#0A1C4D&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:820}}\">\nconst ITEMS = [\n  { label: 'Networking', sub: 'Meet, capture, follow up', promise: 'Meet people, remember them, and keep in touch.',\n    subs: [\n      { tab: 'Meet', promise: 'Share who you are in one tap.',\n        chips: ['Share your profile (your digital business card) by tapping phones, showing a QR code, or sending a link.',\n                'A widget on your lock screen shows your QR code and has a Scan shortcut.',\n                'Keep a separate profile for each job or venture.',\n                'The person you meet does not need the mTap app. Your profile opens in their web browser, where they can save your details.'],\n        href: 'https://mtapnfc.com/digital-business-card',\n        alts: [{ label: 'Get a physical card that shares your profile with a tap', href: 'https://mtapnfc.com/shop#custom-nfc-cards' }] },\n      { tab: 'Capture', promise: 'Capture anyone you meet in seconds.',\n        chips: ['Scan a paper business card, an event badge, a LinkedIn QR code or an mTap QR code.',\n                'Everyone you capture is saved in your mTap Hub, your own contact list inside the app.',\n                'Connect HubSpot, Salesforce, Zoho, Keap, Redtail, GoHighLevel or Vin Solutions and your contacts sync there too. Other CRMs can be added on request.'],\n        href: 'https://mtapnfc.com/hub',\n        alts: [{ label: 'See the tools mTap connects to', href: 'https://mtapnfc.com/integrations' }] },\n      { tab: 'Know', promise: 'Add a name and email, get the full picture.',\n        chips: ['mTap adds each contact\\'s job title, company and LinkedIn for you.',\n                'Turn on automatic enrichment and every new contact is filled in the moment you save it.',\n                'Notes, photos and voice memos help you remember the conversation.'],\n        href: 'https://mtapnfc.com/enrichment', alts: [] },\n      { tab: 'Follow up', promise: 'Pick a template, make it yours, and send it the moment you connect.',\n        chips: ['Start from a ready-made template and edit it to sound like you.',\n                'Send it automatically the moment you and a new contact swap information, or review it first.',\n                'Messages go out by email, text or WhatsApp.',\n                'Your profile and calendar link are included so they can reach you easily.'],\n        href: 'https://mtapnfc.com/follow-up',\n        alts: [{ label: 'See how NJBIA followed up with every attendee', href: 'https://mtapnfc.com/case-studies/njbia' }] }\n    ] },\n  { label: 'Host Events', sub: 'Plan, run, promote', promise: 'Everything to plan, run and promote your event.',\n    subs: [\n      { tab: 'Set up', promise: 'Set up your event in one place, in person or online.',\n        chips: ['Hosting is free, and ticket fees are over 80% lower than Eventbrite.',\n                'Guests can buy tickets and pay on your event page, with coupons and a waitlist.',\n                'Prefer your current sign-up system? Keep using it and upload your guest list.',\n                'Host an in-person event, or run an online event or webinar.',\n                'Guests can add the event and agenda to their calendars, and schedule changes show up right away.'],\n        href: 'https://mtapnfc.com/host-event',\n        alts: [{ label: 'Big conference or trade show?', href: 'https://mtapnfc.com/for-conferences' }] },\n      { tab: 'Check in', promise: 'No lines at the door.',\n        chips: ['Print custom name badges, each with its own QR code.',\n                'Easily track which name badges still need to be printed.',\n                'Check guests in by scanning their QR code.',\n                'Check guests in to breakout sessions too, with attendance recorded for each one.',\n                'Welcome walk-in guests easily by adding them on the spot.'],\n        href: 'https://mtapnfc.com/host-event', alts: [] },\n      { tab: 'Engage', promise: 'Keep the whole room involved.',\n        chips: ['Guests ask questions and vote in polls live during sessions.',\n                'A floor map helps guests find every booth.',\n                'Points and a leaderboard reward guests for taking part.',\n                'Your sponsors and speakers each get their own spotlight.',\n                'Guests browse who is attending and chat one on one.'],\n        href: 'https://mtapnfc.com/host-event', alts: [] },\n      { tab: 'Promote', promise: 'Fill the room and keep guests in the loop.',\n        chips: ['Invite past guests and your members.',\n                'List your events on a public calendar that people can follow.',\n                'Send guests reminders and updates by email and text.',\n                'Send every guest a survey after the event.'],\n        href: 'https://mtapnfc.com/host-event',\n        alts: [{ label: 'Get listed on mTap Discover', href: 'https://mtapnfc.com/events/discover' }] }\n    ] },\n  { label: 'Teams and groups', sub: 'Companies, chambers, partners', promise: 'Get everyone pulling in the same direction.',\n    subs: [\n      { tab: 'Companies', promise: 'Get your whole team on the same page.',\n        chips: ['Manage everyone on your team from one dashboard.',\n                'Each teammate\\'s profile matches your company logo and colors.',\n                'See who on your team met whom.',\n                'Add or remove teammates whenever you need to.'],\n        href: 'https://mtapnfc.com/teams', alts: [] },\n      { tab: 'Associations', promise: 'Make every member event count.',\n        chips: ['Keep a member list alongside your events.',\n                'Show your sponsors real results from each event.',\n                'mTap works with your membership software.',\n                'Every event keeps its own record of who came.'],\n        href: 'https://mtapnfc.com/for-associations', alts: [] },\n      { tab: 'Partners', promise: 'Bring mTap to your community.',\n        chips: ['Earn a recurring share when guests you bring join mTap.',\n                'An earnings dashboard tracks what you have made.',\n                'See how many guests joined from each event.'],\n        href: 'https://mtapnfc.com/channel-partners', alts: [] }\n    ] },\n  { label: 'Manage Your Network', sub: 'Import, Refresh, Organize', promise: 'Keep the network you already have up to date.',\n    subs: [\n      { tab: 'Import', promise: 'Start with the contacts you already have.',\n        chips: ['Import the contacts you already have.',\n                'Your contacts come together in your mTap Hub, so they are easy to search in one place.',\n                'Once your CRM is connected, mTap keeps your contacts and activities aligned with it.'],\n        href: 'https://mtapnfc.com/hub',\n        alts: [{ label: 'See the tools mTap connects to', href: 'https://mtapnfc.com/integrations' }] },\n      { tab: 'Refresh', promise: 'Update a big list without checking people one by one.',\n        chips: ['Select all of your contacts, or just some of them, and enrich them together.',\n                'mTap looks up each contact\\'s current job title, company and LinkedIn.',\n                'Check the results yourself in about 15 minutes, or let mTap AI review them within 24 hours.',\
